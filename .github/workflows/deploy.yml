name: Deploy Backend Services to ECR

on:
  push:
    branches:
      - deploy

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "282003745193"
  ECR_REGISTRY: 282003745193.dkr.ecr.us-east-1.amazonaws.com
  VENTAS_REPOSITORY: innovatech-ventas-api
  DESPACHOS_REPOSITORY: innovatech-despachos-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ventas-api image
        uses: docker/build-push-action@v6
        with:
          context: ./ventas-api
          file: ./ventas-api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.ECR_REGISTRY }}/${{ env.VENTAS_REPOSITORY }}:latest

      - name: Build and push despachos-api image
        uses: docker/build-push-action@v6
        with:
          context: ./despachos-api
          file: ./despachos-api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.ECR_REGISTRY }}/${{ env.DESPACHOS_REPOSITORY }}:latest
