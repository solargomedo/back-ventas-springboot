name: Build and deploy backend

on:
  push:
    branches:
      - deploy

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ventas image
        uses: docker/build-push-action@v6
        with:
          context: ./ventas-api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ventas-api:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ventas-api:latest

      - name: Build and push despachos image
        uses: docker/build-push-action@v6
        with:
          context: ./despachos-api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/despachos-api:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/despachos-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy production compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/innovatech-backend

      - name: Deploy backend stack on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/innovatech-backend
            cat > .env <<EOF
            REGISTRY_USER=${{ secrets.DOCKERHUB_USERNAME }}
            IMAGE_TAG=${{ github.sha }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            VENTAS_PORT=${{ secrets.VENTAS_PORT }}
            DESPACHOS_PORT=${{ secrets.DESPACHOS_PORT }}
            EOF
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
